spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/bookingdb}
    username: ${SPRING_DATASOURCE_USERNAME:bookinguser}
    password: ${SPRING_DATASOURCE_PASSWORD:bookingpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
