server:
  port: 8083

spring:
  application:
    name: booking-service
  profiles:
    default: prod

jwt:
  secret: ${JWT_SECRET:easystay-secret-key-2026-microservices-architecture-secure}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

house:
  service:
    url: ${HOUSE_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
