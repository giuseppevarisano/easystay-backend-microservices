server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Auth Service Routes
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # House Service Routes
        - id: house-service
          uri: ${HOUSE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/case-vacanza/**
          filters:
            - StripPrefix=0

        # Booking Service Routes
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/prenotazioni/**
          filters:
            - StripPrefix=0

        # OpenAPI Docs Routes
        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/docs/auth
          filters:
            - SetPath=/api-docs

        - id: house-service-docs
          uri: ${HOUSE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/docs/house
          filters:
            - SetPath=/api-docs

        - id: booking-service-docs
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/docs/booking
          filters:
            - SetPath=/api-docs

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization

jwt:
  secret: ${JWT_SECRET:easystay-secret-key-2026-microservices-architecture-secure}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /docs/auth
      - name: house-service
        url: /docs/house
      - name: booking-service
        url: /docs/booking
